version: '3.8'

services:
  web_api:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY . .
        ENV PORT=8000
        ENV DATABASE_URL="postgresql://user:pass@db:5432/production"
        EXPOSE 8000
        CMD ["python", "main.py"]
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_HOST=db
    depends_on:
      - db
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword123
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: